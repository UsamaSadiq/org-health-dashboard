# Suggested candidate checks for the Open edX repo-health suite.
# Surfaced on the Checks Catalog page so the community can see what is proposed
# but not yet implemented. `status` is one of: proposed | phase-2.
# `feasibility` notes how it would be collected.
candidates:
  - name: "SECURITY.md present"
    rationale: "A published security policy is an OpenSSF Scorecard signal and a baseline for responsible disclosure."
    status: "proposed"
    feasibility: "Local file check (SECURITY.md / .github/SECURITY.md); zero API."
    chaoss_metric: "Security"
    scorecard_check: "Security-Policy"
  - name: "LICENSE present"
    rationale: "Every repo should declare a license; absence blocks reuse and distribution."
    status: "proposed"
    feasibility: "Local file check (LICENSE/LICENSE.txt/LICENSE.rst); zero API."
    scorecard_check: "License"
  - name: "CODE_OF_CONDUCT present"
    rationale: "Community health file expected of Open edX repositories."
    status: "proposed"
    feasibility: "Local file check; zero API."
  - name: "CODEOWNERS present"
    rationale: "Routes reviews to maintainers and complements catalog-info ownership."
    status: "proposed"
    feasibility: "Local file check (.github/CODEOWNERS); zero API."
  - name: "pre-commit configured"
    rationale: "Standardizes local linting/formatting before CI."
    status: "proposed"
    feasibility: "Local file check (.pre-commit-config.yaml); zero API."
  - name: "GitHub Actions pinned by SHA"
    rationale: "Pinning actions to a full commit SHA mitigates supply-chain tampering (Scorecard Pinned-Dependencies)."
    status: "proposed"
    feasibility: "Parse .github/workflows/*.yml for `uses:` refs; zero API."
    scorecard_check: "Pinned-Dependencies"
  - name: "Branch protection enabled"
    rationale: "Required reviews and status checks on the default branch are a core governance control."
    status: "phase-2"
    feasibility: "Needs the GitHub branch-protection API (often admin scope) — deferred."
    scorecard_check: "Branch-Protection"
  - name: "OpenSSF Scorecard ingestion"
    rationale: "Fold the full OpenSSF Scorecard result into the dashboard as first-class metrics."
    status: "phase-2"
    feasibility: "Needs the Scorecard API/action; dashboard already has a scorecard client helper."
