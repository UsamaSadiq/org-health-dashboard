groups:
  - name: "File Existence"
    pattern: "^exists\\..*"
  - name: "CI / Tooling"
    explicit:
      - github_actions
      - renovate.configured
      - travis_ci.active
      - travis_yml.parsable
      - tox_tox_section
  - name: "Dependencies"
    pattern: "^(dependabot\\..*|dependencies\\..*)"
  - name: "Documentation"
    explicit:
      - readthedocs_config.exists
      - docs.build_badge
  - name: "README"
    pattern: "^readme\\..*"
  - name: "Ownership"
    pattern: "^ownership\\..*"