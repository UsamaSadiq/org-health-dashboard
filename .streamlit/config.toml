[browser]
gatherUsageStats = false

[client]
# Public read-only dashboard: the Deploy button and developer menu are noise
# for every visitor and appeared in the top-right of every page.
toolbarMode = "minimal"

[theme]
# Streamlit draws its own chrome (st.dataframe grids, inputs, popovers) from this
# base theme, and it cannot be switched from Python. The dashboard defaults to
# dark (dashboard/ui/theme.py), so the base matches the dark palette: tables and
# inputs blend in for the default view. Viewers who switch to light via the
# sidebar toggle keep dark native widgets on a light page.
base = "dark"
primaryColor = "#2DD4BF"
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#F1F5F9"
font = "sans serif"
