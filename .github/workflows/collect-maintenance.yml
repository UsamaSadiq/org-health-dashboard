name: Collect maintenance signals

# Collects maintenance signals from public GitHub data (upgrade-job health; wave
# and redundant-PR collectors are added alongside) and publishes them to
# openedx/maintenance/ on the orphan `data` branch, next to the scores. The
# dashboard only reads these files.

on:
  schedule:
    - cron: "53 8 * * *"
  workflow_dispatch:

concurrency:
  group: collect-maintenance
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      OUT_DIR: ${{ github.workspace }}/out/openedx/maintenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-collectors.txt
      - run: python scripts/collect_maintenance.py --out-dir "$OUT_DIR"
        env:
          PYTHONPATH: ${{ github.workspace }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to data branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --depth 1 --branch data "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data-branch
          mkdir -p data-branch/openedx/maintenance
          cp "$OUT_DIR"/*.json data-branch/openedx/maintenance/
          cd data-branch
          git add openedx/maintenance
          if git diff --cached --quiet; then
            echo "Maintenance data unchanged."
            exit 0
          fi
          git commit -m "chore(data): update openedx maintenance signals $(date -u +%F)"
          git push origin data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
