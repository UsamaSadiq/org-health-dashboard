name: UX audit

# Two gates that unit tests cannot cover:
#
#   a11y  - axe-core against every page at desktop and mobile. Blocks on the
#           violations we own; Streamlit's own DOM defects are allowlisted
#           per-rule in scripts/uxaudit/a11y.py.
#   diff  - pixel comparison against the reference PNGs in tests/baseline/.
#           Catches clipped labels, colliding text and layout shifts, none of
#           which a unit test sees.
#
# The diff job is advisory (continue-on-error) rather than blocking, because the
# baselines are captured against the live upstream wg-maintenance CSV: a data
# change upstream moves them without any code change here. Read the diff report,
# then either fix the regression or re-record deliberately. The a11y job has no
# such dependency and is strict.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ux-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches .venv and .python-version. Note runtime.txt says 3.14, which
          # is what Streamlit Community Cloud builds with; nothing has ever run
          # the tests on it. Tracked separately.
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/ -q

  accessibility:
    name: Accessibility gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # Browser binary only; the axe-core bundle itself is vendored at
      # scripts/uxaudit/vendor/axe.min.js so the scan needs no network.
      - run: python -m playwright install --with-deps chromium
      - name: Run axe-core over every page
        run: python scripts/ux_audit.py --mode a11y

  visual-diff:
    name: Visual diff (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Compare against committed baselines
        run: python scripts/ux_audit.py --mode diff
      - name: Upload diff images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-diff
          path: .ux-audit/
          retention-days: 7
          if-no-files-found: ignore
