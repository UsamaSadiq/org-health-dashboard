name: UX audit

# Two gates that unit tests cannot cover, both driving a real browser over every
# page at desktop and mobile:
#
#   * axe-core accessibility, blocking on the violations we own; Streamlit's own
#     DOM defects are allowlisted per-rule in scripts/uxaudit/a11y.py.
#   * a pixel diff against the reviewed baselines in tests/baseline/, which is
#     the only thing that catches a clipped axis label, a chart title rendering
#     as "positories", or a repo name overrunning its grade pill.
#
# The visual diff used to be excluded here, for a reason that no longer holds.
# It was unrunnable while the rendering depended on two things CI could not
# control: the upstream history file (absent — it 404'd, so every trend feature
# rendered only where a stale local copy existed) and the live snapshot (which
# moves with upstream data, repainting the page with no code change). Upstream
# now publishes both CSVs, and the harness pins them along with the clock —
# tests/fixtures/data/ plus DASHBOARD_FROZEN_NOW, wired up in
# scripts/uxaudit/app.py. Rendering is now a function of the code alone, so the
# gate can be honest.
#
# The baselines are therefore Linux-rendered, because that is what this runner
# renders. Font rasterisation differs enough between macOS and Linux that a
# macOS-captured baseline fails here on text alone; see docs/RUNBOOK.md for how
# to regenerate them through the same container CI uses.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ux-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches .venv and .python-version. Note runtime.txt says 3.14, which
          # is what Streamlit Community Cloud builds with; nothing has ever run
          # the tests on it. Tracked separately.
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/ -q

  accessibility:
    name: Accessibility gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # Browser binary only; the axe-core bundle itself is vendored at
      # scripts/uxaudit/vendor/axe.min.js so the scan needs no network.
      - run: python -m playwright install --with-deps chromium
      - name: Run axe-core over every page
        run: python scripts/ux_audit.py --mode a11y
      - name: Capture the pages on failure
        if: failure()
        # A screenshot of whatever the runner actually rendered is the fastest
        # diagnosis when the readiness guard fires; continue-on-error because a
        # capture that also fails must not mask the original failure.
        continue-on-error: true
        run: python scripts/ux_audit.py --mode screenshots --out ci-screenshots
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ux-failure-screenshots
          path: ci-screenshots/
          retention-days: 7
          if-no-files-found: ignore

  visual:
    name: Visual diff
    runs-on: ubuntu-latest
    # Pinned container, not the bare runner. Text rasterisation differs enough
    # between operating systems — and between runner images as GitHub updates
    # them — that a baseline captured anywhere else fails on font rendering
    # alone: measured at 1.2-10.6% of pixels changed, whole-page bounding boxes,
    # and page heights shifting 25px from line-wrap differences. That is far
    # above any tolerance that would still catch a real defect.
    #
    # Pinning the image makes the baselines reproducible off this runner too, so
    # a contributor on macOS or Windows can regenerate them and get bytes that
    # match CI: scripts/ux_audit_container.sh runs this exact image locally.
    # Keep the tag in step with the playwright pin in requirements-dev.txt and
    # with IMAGE in that script; all three must agree.
    container:
      image: mcr.microsoft.com/playwright/python:v1.60.0-noble
    steps:
      - uses: actions/checkout@v4
      # No setup-python and no `playwright install`: the image already carries
      # Python 3.12 and the matching browser build. Installing either again
      # would be the thing that breaks parity with the local script.
      - run: pip install --break-system-packages -r requirements.txt -r requirements-dev.txt
      - name: Diff every page against tests/baseline/
        # The app renders the pinned fixture at the pinned instant, so a
        # difference here is a UI change and nothing else. If this fails on a PR
        # that did not intend a visual change, read the diff images below before
        # regenerating anything: a baseline regenerated to silence the gate
        # deletes the evidence of whatever it was about to catch.
        run: python scripts/ux_audit.py --mode diff
      - name: Upload diff images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Both the highlighted diffs and the candidate captures: the diff
          # shows where the change is, the candidate shows what it now looks
          # like, and reviewing a visual change needs both.
          name: ux-visual-diff
          path: |
            .ux-audit/diff/
            .ux-audit/current/
          retention-days: 7
          if-no-files-found: ignore

